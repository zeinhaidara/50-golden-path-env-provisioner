---
name: provision

# Reusable golden-path workflow. Callers pass one parameter file and an OIDC
# role; no AWS keys are stored anywhere. Never run from this repo's CI.
on:
  workflow_call:
    inputs:
      params_file:
        description: Path to the environment parameter file, e.g. params/dev.yaml
        type: string
        required: true
      environment:
        description: GitHub environment for the apply job (protect it with required reviewers)
        type: string
        required: true
      aws_role_arn:
        description: IAM role assumed through GitHub OIDC
        type: string
        required: true
      tf_state_bucket:
        description: S3 bucket for Terraform state
        type: string
        required: true

permissions:
  contents: read

env:
  TF_VERSION: "1.15.8"
  # sha256 of terraform_1.15.8_linux_amd64.zip from releases.hashicorp.com SHA256SUMS
  TF_SHA256: "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.meta.outputs.env_name }}
      region: ${{ steps.meta.outputs.region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Validate and render parameters
        env:
          PARAMS_FILE: ${{ inputs.params_file }}
        run: python -m golden render "$PARAMS_FILE" --out build
      - name: Read environment metadata
        id: meta
        env:
          PARAMS_FILE: ${{ inputs.params_file }}
        run: |
          set -euo pipefail
          env_name=$(python -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["environment"])' "$PARAMS_FILE")
          region=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["region"])' "build/$env_name/meta.json")
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"
      - name: Install Terraform (sha256 checked)
        run: |
          set -euo pipefail
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -sSfLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/${zip}"
          echo "${TF_SHA256}  $RUNNER_TEMP/$zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/tf"
          echo "$RUNNER_TEMP/tf" >> "$GITHUB_PATH"
      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered
          path: build/
          retention-days: 1

  plan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ needs.validate.outputs.env_name }}
      AWS_REGION: ${{ needs.validate.outputs.region }}
      STATE_BUCKET: ${{ inputs.tf_state_bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: build/
      - name: Install Terraform (sha256 checked)
        run: |
          set -euo pipefail
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -sSfLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/${zip}"
          echo "${TF_SHA256}  $RUNNER_TEMP/$zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/tf"
          echo "$RUNNER_TEMP/tf" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ needs.validate.outputs.region }}
      - name: Terraform plan
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=golden-path/${ENV_NAME}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -var-file="../build/${ENV_NAME}/terraform.tfvars.json" -out=tfplan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    needs: [validate, plan]
    runs-on: ubuntu-latest
    # Required reviewers on this environment are what gate the apply.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ needs.validate.outputs.env_name }}
      AWS_REGION: ${{ needs.validate.outputs.region }}
      STATE_BUCKET: ${{ inputs.tf_state_bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered
          path: build/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: terraform/
      - name: Install Terraform (sha256 checked)
        run: |
          set -euo pipefail
          zip="terraform_${TF_VERSION}_linux_amd64.zip"
          curl -sSfLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TF_VERSION}/${zip}"
          echo "${TF_SHA256}  $RUNNER_TEMP/$zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/tf"
          echo "$RUNNER_TEMP/tf" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ needs.validate.outputs.region }}
      - name: Terraform apply (the reviewed plan only)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=golden-path/${ENV_NAME}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false tfplan
      - name: Kubeconfig for the new cluster
        working-directory: terraform
        run: |
          set -euo pipefail
          cluster=$(terraform output -raw cluster_name)
          aws eks update-kubeconfig --name "$cluster" --region "$AWS_REGION"
      - name: Observability stack and sample app
        working-directory: ansible
        run: |
          set -euo pipefail
          python -m pip install -r ../requirements-ansible.txt
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory.ini site.yml -e "@../build/${ENV_NAME}/ansible-vars.json"
